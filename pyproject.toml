[project]
name = "price-engine-private"
version = "1.0.0"
description = "Price Engine Multi-Country"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "supabase==2.10.0",
  "pytz==2024.1",
  "httpx==0.27.2",
  "curl-cffi==0.7.4",
  "python-dotenv==1.0.1"
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.setuptools]
packages = ["api"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
